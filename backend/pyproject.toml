[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emotion-diary-backend"
version = "0.1.0"
description = "오늘의 하루 — FastAPI 백엔드 (KcBERT + FastText + Gemini 하이브리드 감정 분석, DB 영속화)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.138",
    "uvicorn[standard]>=0.49",
    "sqlalchemy>=2.0",
    "alembic>=1.19",
    "aiosqlite>=0.22",
    "pydantic[email]>=2.13",
    "pydantic-settings>=2.15",
    "google-genai>=2.17",
    "torch>=2.12",
    "transformers>=5.12",
    "fasttext-wheel>=0.9.2",
    "python-dotenv>=1.2",
    "slowapi>=0.1.9",
    "bcrypt>=4.1",
    "pyjwt>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "httpx>=0.28",
]

[tool.setuptools.packages.find]
# backend/ 에는 app/(패키지) 말고도 models/(AI 바이너리), training/(스크립트), alembic/(마이그레이션)이
# 나란히 있어 setuptools의 flat-layout 자동 탐지가 "여러 top-level 패키지"로 오인해 실패한다.
# 실제로 pip 설치 대상이 되는 패키지는 app/ 하나뿐이므로 명시적으로 좁힌다.
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
